<style>

input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#fff}

label.f{display:block;margin:.7rem 0 .25rem;font-weight:700;font-size:.9rem}

.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chk{display:flex;gap:.5rem;align-items:center;margin:.35rem 0}

.demo{background:var(--sun);border-radius:999px;padding:.15rem .55rem;font-size:.75rem;font-weight:700}

.center{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.login{max-width:420px;text-align:center}

<script type="module">
/* =====================================================================
   ① 設定區：部署前只需要改這兩個地方（詳見「設定教學.md」）
   ===================================================================== */

// Apps Script「部署 → 網頁應用程式」的網址。保持空字串 = 示範模式（不連線，可先試玩）
const API_URL = '';
// Google Cloud「OAuth 用戶端 ID」（和 Code.gs 裡的 CLIENT_ID 一樣）
const GOOGLE_CLIENT_ID = '757802579785-c6nk6pv185ctk99sb7og309gegud0smm.apps.googleusercontent.com';

/* ===================================================================== */

const ROLES = {
  admin:  { label: '管理者（爸媽）', short: '管理者', can: '看全部相簿、上傳、管理家人與權限、回收桶、動態紀錄' },
  family: { label: '家人（可上傳）', short: '可上傳', can: '看開放的相簿、上傳到允許上傳的相簿、按愛心、留言' },
  viewer: { label: '只能看', short: '只能看', can: '看開放的相簿、按愛心、留言' },
};
const VIS = {
  everyone: { icon: '🌏', label: '所有家人' },
  family:   { icon: '🏠', label: '核心家人（管理者＋可上傳的家人）' },
  parents:  { icon: '🔒', label: '只有爸媽' },
};
const RELATIONS = ['爺爺','奶奶','阿公','阿嬤','外公','外婆','叔叔','伯伯','姑姑','舅舅','阿姨','嬸嬸','哥哥','姊姊','保母','其他'];
const MILESTONES = ['滿月','收涎','百日','第一次笑','第一次翻身','第一次坐','第一次爬','第一顆牙','第一次吃副食品','第一次站','第一次走路','第一次叫爸爸','第一次叫媽媽','第一次剪頭髮','第一次出遊','周歲抓周','生日'];
const MAX_VIDEO = 200 * 1024 * 1024;

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const fmtTime = t => { const d = new Date(t); return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ago = t => { if (!t) return '還沒登入過'; const m = (Date.now()-t)/6e4; if (m<60) return '剛剛上線'; if (m<1440) return `${Math.floor(m/60)} 小時前上線`; return `${Math.floor(m/1440)} 天前上線`; };
const fmtBytes = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : (b/1e6).toFixed(1)+' MB';
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const AV_COLORS = ['#ff8fa3','#8fd3c1','#9cc9f5','#ffb86b','#c9b6f2','#7fc8a9'];
const avColor = s => AV_COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % AV_COLORS.length];
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

function canSee(a, me) {
  return me.role === 'admin' || a.visibility === 'everyone' || (a.visibility === 'family' && me.role === 'family') || (a.allowed || []).includes(me.email);
}
function canUploadTo(a, me) { return me.role === 'admin' || (me.role === 'family' && a.allowUpload && canSee(a, me)); }

function babyAge(ts) {
  if (!S.cfg.birthday) return '';
  const b = new Date(S.cfg.birthday + 'T00:00:00'), d = new Date(ts);
  if (d < b) return '出生前';
  const days = Math.floor((d - b) / 864e5);
  let m = (d.getFullYear()-b.getFullYear())*12 + d.getMonth() - b.getMonth(), day = d.getDate() - b.getDate();
  if (day < 0) { m--; day += new Date(d.getFullYear(), d.getMonth(), 0).getDate(); }
  if (m < 1) return `出生第 ${days+1} 天`;
  const y = Math.floor(m/12), mm = m % 12;
  return (y ? `${y} 歲` : '') + (mm ? `${mm} 個月` : '') + (day ? `${day} 天` : '');
}

/* ---------- 照片處理（壓縮＋自動去除 GPS 等 EXIF 隱私資訊） ---------- */
async function exifDate(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4) {
      const mk = v.getUint16(o), len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
        const find = (ifd, tag) => { const n = g16(t + ifd); for (let i = 0; i < n; i++) { const e = t + ifd + 2 + i * 12; if (g16(e) === tag) return e; } return -1; };
        const ifd0 = g32(t + 4);
        let ent = -1;
        const ex = find(ifd0, 0x8769);
        if (ex >= 0) ent = find(g32(ex + 8), 0x9003);
        if (ent < 0) ent = find(ifd0, 0x0132);
        if (ent < 0) return null;
        const off = t + g32(ent + 8); let s = '';
        for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(off + i));
        const m = s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
        return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch {}
  return null;
}
async function loadImg(file) {
  const url = URL.createObjectURL(file); const img = new Image(); img.src = url;
  try { await img.decode(); } catch { URL.revokeObjectURL(url); throw new Error('這個格式無法讀取（iPhone 的 HEIC 請在相簿選取時讓手機自動轉檔）'); }
  return img;
}
function resize(src, w, h, max, q) {
  const s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function videoPoster(file) {
  const url = URL.createObjectURL(file); const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  try {
    await Promise.race([new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = no; }), new Promise((_, no) => setTimeout(no, 8000))]);
    v.currentTime = Math.min(1, (v.duration || 0) / 2);
    await Promise.race([new Promise(ok => v.onseeked = ok), new Promise((_, no) => setTimeout(no, 8000))]);
    const poster = await resize(v, v.videoWidth, v.videoHeight, 480, .8);
    return { poster, w: v.videoWidth, h: v.videoHeight, duration: Math.round(v.duration || 0) };
  } catch {
    const c = document.createElement('canvas'); c.width = c.height = 480; const g = c.getContext('2d');
    g.fillStyle = '#f6d6cc'; g.fillRect(0, 0, 480, 480); g.fillStyle = '#fff'; g.font = '160px sans-serif'; g.textAlign = 'center'; g.fillText('▶', 240, 300);
    return { poster: await new Promise(r => c.toBlob(r, 'image/jpeg', .8)), w: 0, h: 0, duration: 0 };
  } finally { URL.revokeObjectURL(url); }
}
async function prepareFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > MAX_VIDEO) throw new Error('影片超過 200MB，請先剪短');
    const { poster, w, h, duration } = await videoPoster(file);
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
    const vid = new Blob([file], { type: file.type || 'video/mp4' });
    return { kind: 'video', origName: file.name, takenAt: file.lastModified || Date.now(), w, h, duration, parts: [['thumb', poster, 'thumb.jpg'], ['full', vid, 'video.' + ext]] };
  }
  const takenAt = (await exifDate(file)) || file.lastModified || Date.now();
  const img = await loadImg(file);
  const w = img.naturalWidth, h = img.naturalHeight;
  // 原檔以完整解析度重新存檔（移除 GPS），另做顯示用與縮圖
  const full = await resize(img, w, h, 6000, .92), disp = await resize(img, w, h, 1600, .85), thumb = await resize(img, w, h, 360, .75);
  URL.revokeObjectURL(img.src);
  return { kind: 'image', origName: file.name.replace(/\.[^.]+$/, '') + '.jpg', takenAt, w, h, parts: [['thumb', thumb, 'thumb.jpg'], ['disp', disp, 'disp.jpg'], ['full', full, 'full.jpg']] };
}

/* =====================================================================
   ② 資料後端：Google Apps Script ＋ 你的 Google 雲端硬碟（零費用）
   ===================================================================== */
const TOKEN_KEY = 'albumIdToken';
const jwtPayload = t => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return {}; } };
const jwtExp = t => (jwtPayload(t).exp || 0) * 1000;
async function waitGIS() {
  for (let i = 0; i < 150 && !window.google?.accounts?.id; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.google?.accounts?.id) throw new Error('Google 登入元件載入失敗，請檢查網路後重新整理');
}
function b64ToBlob(b64, type = '') { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); }
const toB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
const mkErr = code => { const e = new Error(code); e.code = code; return e; };

function makeGAS(url, clientId) {
  let token = LS.get(TOKEN_KEY, ''), waiters = [];
  const cache = new Map(), inflight = new Map(), pending = new Map();
  let timer = null;
  const valid = () => token && jwtExp(token) - Date.now() > 90e3;
  const gotToken = t => { token = t; LS.set(TOKEN_KEY, t); const w = waiters; waiters = []; w.forEach(f => f(t)); };

  async function ensureToken() {
    if (valid()) return token;
    await waitGIS();
    const t = await new Promise(res => { waiters.push(res); try { google.accounts.id.prompt(); } catch {} setTimeout(() => res(null), 12000); });
    if (!t) { setTimeout(() => { if (!$('#gbtn')) renderLogin('登入已過期，請再按一次登入'); }, 0); throw mkErr('TOKEN_EXPIRED'); }
    return t;
  }
  async function call(action, args = {}, retry = true) {
    const t = await ensureToken();
    let r;
    try { r = await fetch(url, { method: 'POST', body: JSON.stringify({ action, token: t, ...args }) }); }
    catch { throw mkErr('NETWORK'); }
    const j = await r.json().catch(() => ({ ok: false, error: 'BAD_RESPONSE' }));
    if (!j.ok) {
      if (j.error === 'TOKEN_INVALID' && retry) { token = ''; LS.set(TOKEN_KEY, ''); return call(action, args, false); }
      const e = mkErr(j.error); e.email = j.email; throw e;
    }
    return j.data;
  }

  // 縮圖一次批次取 24 張，減少往返
  function flush() {
    timer = null;
    const groups = {};
    for (const [k, e] of pending) (groups[e.which] ||= []).push([k, e]);
    pending.clear();
    for (const which in groups) {
      const list = groups[which];
      for (let i = 0; i < list.length; i += 24) {
        const part = list.slice(i, i + 24);
        call('media', { ids: part.map(([k]) => k.split('|')[1]), which }).then(res => {
          for (const [k, e] of part) {
            const b = res[k.split('|')[1]];
            if (b) { const u = URL.createObjectURL(b64ToBlob(b, 'image/jpeg')); cache.set(k, u); e.res(u); } else e.rej(mkErr('NO_MEDIA'));
          }
        }).catch(err => part.forEach(([, e]) => e.rej(err)));
      }
    }
  }
  function media(p, which) {
    const k = which + '|' + p.id;
    if (cache.has(k)) return Promise.resolve(cache.get(k));
    if (inflight.has(k)) return inflight.get(k);
    const pr = new Promise((res, rej) => { pending.set(k, { which, res, rej }); if (!timer) timer = setTimeout(flush, 60); })
      .finally(() => inflight.delete(k));
    inflight.set(k, pr); return pr;
  }
  // 原檔（影片、下載原圖）分段取回
  async function original(p, onProg) {
    const k = 'full|' + p.id;
    if (cache.has(k)) return cache.get(k);
    const CH = 6 * 1024 * 1024, parts = [];
    let start = 0, total = Infinity;
    while (start < total) {
      const r = await call('chunk', { id: p.id, start, len: CH });
      const blob = b64ToBlob(r.b64); if (!blob.size) break;
      parts.push(blob); start += blob.size; total = r.total || start;
      onProg?.(Math.min(1, start / total));
    }
    const u = URL.createObjectURL(new Blob(parts, { type: p.mime || (p.kind === 'video' ? 'video/mp4' : 'image/jpeg') }));
    cache.set(k, u); return u;
  }

  return {
    demo: false,
    init(cb) {
      waitGIS().then(() => {
        google.accounts.id.initialize({
          client_id: clientId, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true,
          callback: r => { gotToken(r.credential); if (!S.me) cb(true); },
        });
        if (valid()) cb(true); else { cb(false); google.accounts.id.prompt(); }
      }).catch(e => { app.innerHTML = `<div class="center"><div class="card">${esc(e.message)}</div></div>`; });
    },
    renderButton(el) { waitGIS().then(() => google.accounts.id.renderButton(el, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'zh-TW', width: 280 })).catch(() => {}); },
    async signIn() { await waitGIS(); google.accounts.id.prompt(); },
    async signOut() { token = ''; LS.set(TOKEN_KEY, ''); cache.forEach(u => URL.revokeObjectURL(u)); cache.clear(); try { google.accounts.id.disableAutoSelect(); } catch {} },
    currentEmail() { return jwtPayload(token).email || ''; },
    bootstrap() { return call('bootstrap'); },
    setConfig(c) { return call('setConfig', { cfg: c }); },
    saveMember(m) { return call('saveMember', { member: m }); },
    removeMember(email) { return call('removeMember', { email }); },
    async saveAlbum(a) { return (await call('saveAlbum', { album: a })).id; },
    deleteAlbum(id) { return call('deleteAlbum', { id }); },
    async upload(albumId, item, meta, onProg) {
      const parts = Object.fromEntries(item.parts.map(([k, b]) => [k, b])), full = parts.full;
      const mime = full.type || 'application/octet-stream';
      const { uploadId } = await call('uploadStart', {
        albumId, meta: { ...meta, mime }, thumb: await toB64(parts.thumb), disp: parts.disp ? await toB64(parts.disp) : '',
        orig: { name: item.origName || 'file', mime, size: full.size } });
      const CH = 6 * 1024 * 1024;   // 必須是 256KB 的倍數
      for (let s = 0; s < full.size; s += CH) {
        const b64 = await toB64(full.slice(s, s + CH));
        try { await call('uploadChunk', { uploadId, start: s, b64 }); }
        catch (e) { if (e.code !== 'NETWORK') throw e; await new Promise(r => setTimeout(r, 2000)); await call('uploadChunk', { uploadId, start: s, b64 }); }
        onProg?.(Math.min(1, (s + CH) / full.size));
      }
      return { ...(await call('uploadFinish', { uploadId })) };
    },
    getMediaURL(p, which, onProg) { return which === 'full' ? original(p, onProg) : media(p, which); },
    updatePhoto(p, patch) { return call('updatePhoto', { id: p.id, patch }); },
    toggleLike(p, email, on) { return call('like', { id: p.id, on }); },
    listComments(p) { return call('comments', { id: p.id }); },
    addComment(p, c) { return call('addComment', { id: p.id, text: c.text }); },
    deleteComment(p, c) { return call('delComment', { cid: c.id }); },
    deleteForever(p) { return call('deleteForever', { id: p.id }); },
    log(e) { return call('log', { text: e.text }).catch(() => {}); },
    listActivity() { return call('activity'); },
  };
}

      bytes: 650000, files: { thumb: 'thumb.jpg', full: 'full.jpg' }, _url: { thumb: url, full: url }, _demoVideo: i === 4 };
  });
  photos[photos.length - 1].createdAt = now - 600e3; // 讓最新一張顯示「新」
  const comments = { 'a2/p1': [{ id: 'c1', author: 'ama@demo', name: '阿嬤', text: '好可愛喔！阿嬤好想你～', at: now - 99 * day }] };
  const activity = [

    async deleteAlbum(id) { albums.splice(albums.findIndex(a => a.id === id), 1); },
    async listPhotos(a, me) { return photos.filter(p => p.albumId === a.id && (me.role === 'admin' || p.state === 'normal')).map(p => ({ ...p })); },
    async upload(albumId, item, meta, onProg) {
      onProg?.(1);
      const _url = {}, files = {}; let bytes = 0;
      for (const [k, b, n] of item.parts) { _url[k] = URL.createObjectURL(b); files[k] = n; bytes += b.size; }
      const p = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), albumId, ...meta, files, bytes, state: 'normal', likes: [], commentCount: 0, _url };
      photos.push(p); return { ...p };
    },
    async getMediaURL(p, which) { const src = photos.find(x => x.id === p.id); if (!src) throw new Error('gone'); return src._url[which] || src._url.disp || src._url.full || src._url.thumb; },
    async updatePhoto(p, patch) { Object.assign(photos.find(x => x.id === p.id), patch); },
    async toggleLike(p, email, on) { const x = photos.find(y => y.id === p.id); x.likes = on ? [...new Set([...x.likes, email])] : x.likes.filter(e => e !== email); },
    async listComments(p) { return clone(comments[p.albumId + '/' + p.id] || []); },
    async addComment(p, c) { const k = p.albumId + '/' + p.id, n = { id: 'c' + Date.now(), ...c }; (comments[k] ||= []).push(n); photos.find(x => x.id === p.id).commentCount++; return n; },
    async deleteComment(p, c) { const k = p.albumId + '/' + p.id; comments[k] = (comments[k] || []).filter(x => x.id !== c.id); photos.find(x => x.id === p.id).commentCount--; },
    async deleteForever(p) { photos.splice(photos.findIndex(x => x.id === p.id), 1); },
    async log(e) { activity.unshift(e); },
    async listActivity() { return clone(activity); },
  };
}

async function boot() {
  // LINE 內建瀏覽器無法用 Google 登入 → 自動改用手機的外部瀏覽器開啟
  const ua = navigator.userAgent;
  if (/ Line\//i.test(ua) && !location.search.includes('openExternalBrowser')) {
    location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash); return;
  }
  if (API_URL && /FBAN|FBAV|Instagram|MicroMessenger| Line\//i.test(ua)) return renderInApp();
  S.be = API_URL ? makeGAS(API_URL, GOOGLE_CLIENT_ID) : makeDemo();
  S.be.init(signed => signed ? loadAll() : renderLogin());
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function loadAll(keepView) {
  if (!keepView) app.innerHTML = '<div class="center"><div class="spin"></div></div>';
  try {
    const d = await S.be.bootstrap();
    S.me = d.me; S.cfg = d.cfg || {}; S.albums = d.albums || []; S.photos = d.photos || []; S.members = d.members || [];
    const key = 'lastSeen:' + S.me.email;
    if (!keepView) { S.prevSeen = LS.get(key, Date.now() - 3 * 864e5); LS.set(key, Date.now()); }
    if (S.albumId && !albumById(S.albumId)) S.albumId = null;
    render();
  } catch (e) {
    console.error(e);
    S.me = null;
    if (e.code === 'NOT_INVITED') return renderNotInvited(e.email);
    if (/TOKEN|NO_TOKEN/.test(e.code || '')) return renderLogin('請重新登入');
    if (e.code === 'NOT_SETUP') e.message = '後端還沒執行 setup，請參考設定教學第二步';
    app.innerHTML = `<div class="center"><div class="card login"><div class="logo">😵</div><p>讀取資料失敗</p><p class="hint">${esc(e.code || e.message)}</p><button class="btn" data-act="reload">重新整理</button> <button class="btn ghost" data-act="signOut">登出</button></div></div>`;
  }
}

/* ---------- 縮圖延遲載入 ---------- */
const io = new IntersectionObserver(es => es.forEach(async e => {
  if (!e.isIntersecting) return;
  const img = e.target; io.unobserve(img);
  const [aid, pid, which] = img.dataset.media.split('/'); const p = findPhoto(aid, pid);
  if (!p) return;
  try { img.src = await S.be.getMediaURL(p, which); img.onload = () => img.classList.add('ok'); }
  catch { img.closest('.tile')?.classList.add('err'); }
}), { rootMargin: '400px' });
function observeMedia(root = document) { root.querySelectorAll('img[data-media]').forEach(i => io.observe(i)); }

function openModal(html) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.innerHTML = `<div class="sheet">${html}</div>`; m.addEventListener('click', e => { if (e.target === m && !m.dataset.lock) closeModal(); }); document.body.appendChild(m); return m; }

function msSelect(cur = '') {

    <label class="f">選擇檔案（可一次選很多張）</label>

    <div class="prog" id="upProg"></div>`);

async function doUpload(btn) {
  const files = [...$('#upFiles').files]; if (!files.length) return toast('請先選擇檔案');
  const albumId = $('#upAlbum').value, caption = $('#upCap').value.trim(), milestone = readMs();
  const modal = $('#modal'); modal.dataset.lock = '1'; btn.disabled = true;
  const prog = $('#upProg'); prog.innerHTML = files.map((f, i) => `<div class="p"><span>${esc(f.name.slice(0, 28))}</span><span id="pg${i}">等待中</span></div>`).join('');
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i], st = $('#pg' + i);
    if (S.photos.some(p => p.albumId === albumId && p.srcName === f.name && p.srcSize === f.size && p.state !== 'trash')) { st.textContent = '⏭️ 已上傳過'; continue; }
    try {
      st.textContent = '處理中…';
      const item = await prepareFile(f);
      st.textContent = '上傳中…';
      const meta = { kind: item.kind, takenAt: item.takenAt, createdAt: Date.now(), uploader: S.me.email, caption, milestone, w: item.w, h: item.h, srcName: f.name, srcSize: f.size };
      if (item.duration) meta.duration = item.duration;
      S.photos.push(await S.be.upload(albumId, item, meta, x => st.textContent = '上傳中 ' + Math.round(x * 100) + '%'));
      st.textContent = '✅ 完成'; ok++;
    } catch (e) { console.error(e); st.textContent = '❌ ' + (e.code === 'NO_UPLOAD' ? '沒有上傳權限' : (e.message || '失敗')).slice(0, 30); }
  }
  if (ok) logAct(`上傳了 ${ok} 個檔案到「${albumById(albumId)?.name}」`);
  delete modal.dataset.lock;
  btn.disabled = false; btn.textContent = '完成'; btn.dataset.act = 'closeModal';
  toast(`上傳完成 ${ok}/${files.length}`); S.tab = 'timeline'; S.albumId = null;
  render(); document.body.appendChild(modal);
}

      <div id="cmts"><div class="hint">留言載入中…</div></div>
      <div class="row" style="margin-top:.5rem;flex-wrap:nowrap"><input id="cmtIn" placeholder="留言給${esc(babyName())}…" maxlength="500"><button class="btn sm" data-act="addCmt">送出</button></div>
    </div>`;
  const media = $('#lbMedia');
  if (!me.canDownload) media.addEventListener('contextmenu', e => e.preventDefault());
  try {
    if (media.tagName === 'IMG') { media.src = await S.be.getMediaURL(p, 'thumb'); S.be.getMediaURL(p, 'disp').then(u => { if ($('#lbMedia') === media) media.src = u; }).catch(() => {}); }

  loadComments(p);

async function loadComments(p) {

function closeLB() { $('#lb')?.remove(); document.body.style.overflow = ''; S.lb = null; render(); }
const curP = () => S.lb.list[S.lb.i];
async function setState(p, state, msg) {
  const patch = { state }; if (state === 'trash') patch.trashedAt = Date.now();
  await S.be.updatePhoto(p, patch); Object.assign(p, patch);
  const sp = findPhoto(p.albumId, p.id); if (sp) Object.assign(sp, patch);
  if (state === 'trash' && !isAdmin()) S.photos = S.photos.filter(x => x !== sp);
  logAct(msg); toast(msg.replace(/^把/, '已把'));

async function downloadCur() {
  const p = curP();
  try {
    toast('準備下載中…');
    const url = await S.be.getMediaURL(p, 'full'); const blob = await (await fetch(url)).blob();
    const ext = p.kind === 'video' ? ((p.mime || '').includes('quicktime') ? 'mov' : 'mp4') : 'jpg';
    const name = `${babyName()}_${fmtDate(p.takenAt).replace(/\//g, '')}_${p.id.slice(-4)}.${ext}`;
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { if (e.name !== 'AbortError') toast('下載失敗'); }
}

  openModal(`<h2>${email ? '✏️ 編輯家人' : '＋ 邀請家人'}</h2>
    <label class="f">對方的 Gmail（Google 帳號）</label><input id="mEmail" type="email" value="${esc(m.email)}" ${email ? 'disabled' : ''} placeholder="example@gmail.com">
    <label class="f">稱呼</label><input id="mName" value="${esc(m.name || '')}" placeholder="例如：阿嬤、台中奶奶">
    <label class="f">關係</label><select id="mRel"><option value="">—</option>${RELATIONS.map(r => `<option ${r === m.relation ? 'selected' : ''}>${r}</option>`).join('')}</select>
    <label class="f">權限</label><select id="mRole">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${m.role === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
    <p class="hint" id="mRoleHint">${ROLES[m.role].can}</p>
    <label class="chk"><input type="checkbox" id="mDl" ${m.canDownload ? 'checked' : ''}> 允許下載照片</label>
    <div class="row" style="margin-top:.9rem"><button class="btn" data-act="saveMember" data-email="${esc(email || '')}">${email ? '儲存' : '加入並產生邀請訊息'}</button><button class="btn ghost" data-act="closeModal">取消</button><span class="sp"></span>
    ${email ? `<button class="btn danger sm" data-act="removeMember" data-email="${esc(email)}">移除</button>` : ''}</div>
    ${email ? '<p class="hint">移除後，對方立刻看不到任何照片。</p>' : ''}`);
}
function inviteText(m) {
  const url = location.origin + location.pathname + '?openExternalBrowser=1';
  return `${m.name || ''}您好！我們建立了${babyName()}的家庭相簿 👶📷\n\n1️⃣ 打開這個網址：\n${url}\n（如果在 LINE 裡打不開，請按右上角選「用瀏覽器開啟」）\n\n2️⃣ 按「用 Google 帳號登入」，選擇：\n${m.email}\n\n3️⃣ 登入後可以「加入主畫面」，以後點圖示就能看${babyName()}的照片了！`;
}
function showInvite(m) {
  const t = inviteText(m);
  openModal(`<h2>💌 邀請訊息</h2><p class="hint">已把 ${esc(m.name || m.email)} 加入。把下面的訊息傳給對方：</p>
    <textarea readonly style="min-height:12rem">${esc(t)}</textarea>
    <div class="row" style="margin-top:.6rem"><button class="btn" data-act="copy" data-text="${esc(t)}">複製</button>
    <a class="btn" style="background:#06c755;text-decoration:none" href="https://line.me/R/msg/text/?${encodeURIComponent(t)}" target="_blank" rel="noopener">用 LINE 傳送</a>
    <button class="btn ghost" data-act="closeModal">完成</button></div>`);
}
async function showLog() {
  const box = $('#logBox'); if (!box) return;
  try {
    const xs = await S.be.listActivity();
    box.innerHTML = xs.length ? xs.map(x => `<div class="log"><small>${fmtTime(x.at)}</small><b>${esc(x.actorName)}</b> ${esc(x.text)}</div>`).join('') : '<div class="hint">還沒有紀錄</div>';
  } catch { box.innerHTML = '<div class="hint">讀取失敗</div>'; }
}
async function autoPurge() {
  const old = S.photos.filter(p => p.state === 'trash' && p.trashedAt && Date.now() - p.trashedAt > 30 * 864e5);
  for (const p of old) { try { await S.be.deleteForever(p); S.photos = S.photos.filter(x => x !== p); } catch {} }
}

/* ---------- 事件 ---------- */
const keyP = k => { const [a, p] = k.split('/'); return findPhoto(a, p); };
const ACT = {
  reload: () => location.reload(),
  refresh: () => loadAll(true).then(() => toast('已更新')),
  signIn: async () => { try { await S.be.signIn(); } catch (e) { toast('登入失敗：' + (e.code || e.message)); } },
  signOut: async () => { await S.be.signOut(); if (!S.be.demo) location.reload(); },
  copy: async el => { try { await navigator.clipboard.writeText(el.dataset.text); toast('已複製'); } catch { toast('請長按文字手動複製'); } },
  tab: el => { S.tab = el.dataset.tab; S.adminView = null; if (S.tab !== 'timeline') S.albumId = null; render(); scrollTo(0, 0); },
  openAlbum: el => { S.albumId = el.dataset.id; S.tab = 'timeline'; render(); scrollTo(0, 0); },
  clearAlbum: () => { S.albumId = null; render(); },
  upload: () => openUpload(),
  doUpload: el => doUpload(el),
  closeModal: () => closeModal(),
  open: el => openLB(el.dataset.key, el.dataset.list),
  lbClose: () => closeLB(),
  lbGo: el => lbGo(+el.dataset.d),
  download: () => downloadCur(),
  like: async () => { const p = curP(), on = !(p.likes || []).includes(S.me.email);
    try { await S.be.toggleLike(p, S.me.email, on); p.likes = on ? [...(p.likes || []), S.me.email] : p.likes.filter(e => e !== S.me.email); drawLB(); } catch { toast('失敗了，再試一次'); } },
  addCmt: async () => { const t = $('#cmtIn').value.trim(); if (!t) return; const p = curP();
    try { await S.be.addComment(p, { author: S.me.email, name: S.me.name || '', text: t, at: Date.now() }); p.commentCount = (p.commentCount || 0) + 1; $('#cmtIn').value = ''; loadComments(p); } catch { toast('留言失敗'); } },
  delCmt: async el => { const p = curP(), c = S.lb.comments.find(x => x.id === el.dataset.id); if (!c || !confirm('刪除這則留言？')) return;
    try { await S.be.deleteComment(p, c); loadComments(p); } catch { toast('刪除失敗'); } },
  editPhoto: () => openEditPhoto(),
  saveEditPhoto: async () => { const p = curP(), patch = { caption: $('#epCap').value.trim(), milestone: readMs() };
    try { await S.be.updatePhoto(p, patch); Object.assign(p, patch); closeModal(); drawLB(); toast('已儲存'); } catch { toast('儲存失敗'); } },
  setCover: async () => { const p = curP(); try { await S.be.saveAlbum({ id: p.albumId, coverId: p.id }); albumById(p.albumId).coverId = p.id; toast('已設為相簿封面'); } catch { toast('失敗'); } },
  toggleHide: async () => { const p = curP(), hide = p.state !== 'hidden';
    try { await setState(p, hide ? 'hidden' : 'normal', hide ? '把 1 張照片設為隱藏' : '取消隱藏 1 張照片'); if (S.lb.listName === 'timeline' || S.lb.listName === 'milestones' || S.lb.listName === 'hidden') { S.lb.list.splice(S.lb.i, 1); if (S.lb.i >= S.lb.list.length) S.lb.i--; } S.lb.list.length ? drawLB() : closeLB(); } catch { toast('失敗'); } },
  trash: async () => { if (!confirm(isAdmin() ? '移到回收桶？（30 天內可還原）' : '刪除這個檔案？（爸媽可以在 30 天內幫你還原）')) return; const p = curP();
    try { await setState(p, 'trash', `把 1 個檔案移到回收桶（${albumById(p.albumId)?.name}）`); S.lb.list.splice(S.lb.i, 1); if (S.lb.i >= S.lb.list.length) S.lb.i--; S.lb.list.length ? drawLB() : closeLB(); } catch { toast('刪除失敗'); } },
  restore: async el => { const p = keyP(el.dataset.key); try { await setState(p, 'normal', '還原了 1 個檔案'); render(); } catch { toast('失敗'); } },
  purge: async el => { const p = keyP(el.dataset.key); if (!confirm('永久刪除後無法復原，確定嗎？')) return;
    try { await S.be.deleteForever(p); S.photos = S.photos.filter(x => x !== p); logAct('永久刪除了 1 個檔案'); render(); } catch { toast('刪除失敗'); } },
  adminView: el => { S.adminView = el.dataset.v || null; render(); scrollTo(0, 0); if (S.adminView === 'log') showLog(); },
  saveCfg: async () => { const c = { babyName: $('#cfgName').value.trim(), birthday: $('#cfgBirth').value };
    try { await S.be.setConfig(c); Object.assign(S.cfg, c); render(); toast('已儲存'); } catch { toast('儲存失敗'); } },
  editAlbum: el => openEditAlbum(el.dataset.id),
  saveAlbum: async el => {
    const name = $('#alName').value.trim(); if (!name) return toast('請輸入相簿名稱');
    const a = { name, visibility: document.querySelector('input[name=alVis]:checked').value, allowed: [...document.querySelectorAll('.alAllow:checked')].map(x => x.value), allowUpload: $('#alUp').checked };
    if (el.dataset.id) a.id = el.dataset.id; else a.createdAt = Date.now();
    try { const id = await S.be.saveAlbum(a); const ex = albumById(id); ex ? Object.assign(ex, a) : S.albums.push({ ...a, id }); logAct(`${el.dataset.id ? '修改' : '建立'}了相簿「${name}」（${VIS[a.visibility].label}${a.allowed.length ? ` + ${a.allowed.map(memberName).join('、')}` : ''}）`); closeModal(); render(); toast('已儲存'); }
    catch (e) { toast('儲存失敗：' + (e.code || '')); } },
  delAlbum: async el => { const a = albumById(el.dataset.id); if (!confirm(`刪除相簿「${a.name}」？`)) return;
    try { await S.be.deleteAlbum(a.id); S.albums = S.albums.filter(x => x !== a); logAct(`刪除了相簿「${a.name}」`); closeModal(); render(); } catch { toast('刪除失敗'); } },
  editMember: el => openEditMember(el.dataset.email),
  saveMember: async el => {
    const isNew = !el.dataset.email, email = (isNew ? $('#mEmail').value : el.dataset.email).trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('請輸入正確的 Email');
    if (isNew && S.members.some(m => m.email === email)) return toast('這個 Email 已經在名單裡');
    const m = { email, name: $('#mName').value.trim() || $('#mRel').value || email.split('@')[0], relation: $('#mRel').value, role: $('#mRole').value, canDownload: $('#mDl').checked };
    if (isNew) m.addedAt = Date.now();
    try { await S.be.saveMember(m); const ex = S.members.find(x => x.email === email); ex ? Object.assign(ex, m) : S.members.push(m);
      logAct(`${isNew ? '把' : '修改'}「${m.name}」${isNew ? '加入相簿' : '的權限'}（${ROLES[m.role].short}${m.canDownload ? '' : '、不可下載'}）`);
      render(); isNew ? showInvite(m) : (closeModal(), toast('已儲存')); }
    catch (e) { toast('儲存失敗：' + (e.code || '')); } },
  removeMember: async el => { const m = S.members.find(x => x.email === el.dataset.email); if (!confirm(`確定移除「${m.name}」？對方會立刻看不到所有照片。`)) return;
    try { await S.be.removeMember(m.email); S.members = S.members.filter(x => x !== m);
      for (const a of S.albums.filter(a => (a.allowed || []).includes(m.email))) { a.allowed = a.allowed.filter(e => e !== m.email); await S.be.saveAlbum({ id: a.id, allowed: a.allowed }).catch(() => {}); }
      logAct(`把「${m.name}」移出相簿`); closeModal(); render(); toast('已移除'); } catch { toast('移除失敗'); } },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'msSel') { $('#msCustom').style.display = el.value === '__c' ? '' : 'none'; return; }
  if (el.id === 'mRole') { $('#mRoleHint').textContent = ROLES[el.value].can; return; }
  if (el.dataset.change === 'bigText') { document.documentElement.classList.toggle('big', el.checked); LS.set('bigText', el.checked); return; }
  if (el.dataset.change === 'demoUser') { S.be.setUser(el.value); S.tab = 'timeline'; S.albumId = null; S.adminView = null; loadAll(true).then(() => toast(`現在以「${memberName(el.value)}」的身分預覽`)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cmtIn') ACT.addCmt();
  if (!S.lb) return;
  if (e.key === 'ArrowLeft') lbGo(-1); if (e.key === 'ArrowRight') lbGo(1); if (e.key === 'Escape' && !$('#modal')) closeLB();
});

boot();
</script>
</body>
</html>
