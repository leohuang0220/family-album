<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寶寶家庭相簿</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="c-favicon.png">
<link rel="apple-touch-icon" href="c-apple-touch-icon.png">
<meta name="theme-color" content="#F6F9FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --bg:#F6F9FB;--surface:#FFFFFF;--tint:#EDF3F7;--line:#E2E9EE;
  --ink:#1D2A35;--sub:#667785;
  --accent:#2E7DA8;--accent-soft:#E4F0F7;
  --like:#DD5B78;--like-soft:#FCE9EE;
  --gold:#8A5A0B;--gold-soft:#FBF1D9;--danger:#C0414B;--ok:#2F8F6B;
  --r:16px;--shadow:0 1px 2px rgba(29,42,53,.05),0 8px 24px rgba(29,42,53,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html.big{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.ic.fill{fill:currentColor}
.ic.play{fill:currentColor;stroke:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;background:var(--accent);color:#fff;border-radius:12px;padding:.62rem 1.1rem;font-weight:600;transition:background .15s}
.btn:hover{background:#276a90}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:var(--danger)}
.btn.line{background:#06A94D;text-decoration:none;color:#fff}
.btn.sm{padding:.38rem .75rem;font-size:.86rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:.62rem .8rem;background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:4.5rem;resize:vertical}
label.f{display:block;margin:.9rem 0 .3rem;font-weight:600;font-size:.9rem}
.hint{color:var(--sub);font-size:.84rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chk{display:flex;gap:.6rem;align-items:center;margin:.45rem 0}
.chk input{width:auto;transform:scale(1.2);accent-color:var(--accent)}

header.top{position:sticky;top:0;z-index:20;background:rgba(246,249,251,.92);backdrop-filter:blur(12px);padding:calc(.7rem + env(safe-area-inset-top)) 1rem .7rem;display:flex;align-items:center;gap:.4rem;border-bottom:1px solid var(--line)}
header.top h1{font-size:1.3rem;font-weight:700;margin:0;letter-spacing:.01em;line-height:1.25}
header.top .age{font-size:.82rem;color:var(--sub)}
.ibtn{position:relative;width:2.5rem;height:2.5rem;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--tint)}
.ibtn .dot{position:absolute;top:.5rem;right:.55rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--like);border:2px solid var(--bg)}
.demo{background:var(--gold-soft);color:var(--gold);border-radius:8px;padding:.1rem .5rem;font-size:.75rem;font-weight:600}
.demo-sel{width:auto;padding:.35rem .6rem;font-size:.82rem}
main{padding:1rem 1rem calc(6.5rem + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}

nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom))}
nav.bottom button{position:relative;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.72rem;color:var(--sub);min-width:3.8rem;padding:.35rem .2rem}
nav.bottom button.on{color:var(--accent);font-weight:700}
nav.bottom button.on::before{content:"";position:absolute;top:-.3rem;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.bottom .fab{width:3.4rem;height:3.4rem;min-width:0;border-radius:18px;background:var(--accent);color:#fff;justify-content:center;box-shadow:0 8px 20px rgba(46,125,168,.35);margin-top:-1.3rem}
nav.bottom .fab::before{display:none}

.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.25rem .65rem;font-size:.84rem}
.note{display:flex;align-items:center;gap:.5rem;background:var(--accent-soft);color:#1f5f82;border-radius:12px;padding:.55rem .8rem;font-size:.9rem;margin:.6rem 0}

.mem{margin:.4rem 0 1.2rem}
.mem h2{font-size:1rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.4rem}
.mem .strip{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.3rem;scroll-snap-type:x proximity}
.mem .strip .tile{flex:none;width:7.5rem;height:9rem;aspect-ratio:auto;border-radius:12px;scroll-snap-align:start}
.mem .lab{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);border-radius:8px;padding:.05rem .45rem;font-size:.72rem;font-weight:600}

.month{margin:1.5rem 0 .55rem;display:flex;align-items:flex-end;gap:.7rem}
.month .age{font-size:1.35rem;font-weight:700;line-height:1.1;letter-spacing:.01em}
.month .date{font-size:.84rem;color:var(--sub)}
.month .cnt{margin-left:auto;font-size:.8rem;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:3px}
html.big .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tile{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--tint);padding:0;display:block}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;display:block}
.tile img.ok{opacity:1}
.tile .b{position:absolute;display:inline-flex;align-items:center;gap:.2rem;font-size:.7rem;font-weight:700;border-radius:8px;padding:.05rem .4rem;line-height:1.35}
.tile .new{top:5px;left:5px;background:var(--accent);color:#fff}
.tile .vid{bottom:5px;right:5px;background:rgba(29,42,53,.62);color:#fff}
.tile .ms{top:5px;right:5px;background:var(--gold-soft);color:var(--gold)}
.tile .hid{bottom:5px;left:5px;background:rgba(29,42,53,.62);color:#fff}
.tile .lk{bottom:5px;left:5px;background:rgba(255,255,255,.92);color:var(--like)}
.tile.err::after{content:"無法載入";position:absolute;inset:0;display:grid;place-items:center;font-size:.75rem;color:var(--sub)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.card h3{margin:0 0 .6rem;font-size:1.02rem;display:flex;align-items:center;gap:.45rem}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.album{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;position:relative}
.album .cv{aspect-ratio:4/3;background:var(--tint);display:grid;place-items:center;color:#9db0bd;overflow:hidden}
.album .cv img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.album .cv img.ok{opacity:1}
.album .meta{padding:.65rem .8rem .75rem}
.album .meta b{display:block;font-size:1rem}
.album .meta small{color:var(--sub);display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center;margin-top:.1rem}
.album .edit{position:absolute;top:.5rem;right:.5rem;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:.2rem .55rem;font-size:.8rem;display:inline-flex;align-items:center;gap:.25rem}
.vis{display:inline-flex;align-items:center;gap:.25rem;font-size:.76rem;border-radius:8px;padding:.05rem .45rem;background:var(--tint);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:3.5rem 1rem}
.empty .ic{color:#a9bac6;margin-bottom:.4rem}

.ms-list .it{display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;margin-bottom:.6rem;width:100%;text-align:left}
.ms-list .th{width:76px;height:76px;border-radius:12px;overflow:hidden;flex:none;background:var(--tint)}
.ms-list .th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.ms-list .th img.ok{opacity:1}
.ms-list b{display:flex;align-items:center;gap:.35rem}
.ms-list b .ic{color:#C99512}
.ms-list small{color:var(--sub)}

.mrow{display:flex;gap:.75rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.av{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.mrow .info{flex:1;min-width:0}
.mrow .info small{display:block;color:var(--sub)}
.role{font-size:.72rem;border-radius:8px;padding:.05rem .45rem;font-weight:600}
.role.admin{background:var(--accent-soft);color:#1f5f82}
.role.family{background:#E3F4EC;color:#216b4f}
.role.viewer{background:var(--tint);color:var(--sub)}
.log{font-size:.88rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.log small{color:var(--sub);margin-right:.5rem}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.5rem}
.mini-grid .m{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.75rem}
.mini-grid .m .tile{border-radius:0}
.mini-grid .m .acts{display:flex;flex-direction:column;gap:3px;padding:5px}

.modal{position:fixed;inset:0;z-index:70;background:rgba(29,42,53,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:1.2rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 .3rem;font-size:1.2rem}
.prog .p{display:flex;justify-content:space-between;font-size:.86rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}
.prog .ok{color:var(--ok);font-weight:600}.prog .bad{color:var(--danger)}

.share-list{display:grid;gap:.5rem;margin-top:.8rem}
.sh{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;text-align:left;text-decoration:none;color:var(--ink);font-weight:600}
.sh:hover{background:var(--tint)}
.sh .mk{width:2.2rem;height:2.2rem;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sh .mk.line{background:#06A94D;color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.02em}
.sh small{display:block;font-weight:400;color:var(--sub)}

.feed-av{display:flex;gap:.9rem;overflow-x:auto;padding:.4rem 0 .6rem}
.feed-av .p{flex:none;text-align:center;width:4.2rem;font-size:.74rem;color:var(--sub)}
.feed-av .p b{display:block;color:var(--ink);font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-av .av{margin:0 auto .2rem}
.fi{padding:.8rem 0;border-bottom:1px solid var(--line)}
.fi:last-child{border:0}
.fi .t{font-size:.92rem}
.fi .t small{color:var(--sub);margin-left:.3rem}
.fi .th{display:flex;gap:4px;margin-top:.5rem}
.fi .th .tile{width:4.2rem;height:4.2rem;aspect-ratio:auto;flex:none}

.lb{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;gap:.2rem;padding:calc(.4rem + env(safe-area-inset-top)) .6rem .4rem;background:var(--surface);border-bottom:1px solid var(--line)}
.lb-top .d{font-size:.88rem;color:var(--sub);margin-left:.3rem}
.lb-stage{position:relative;flex:1;min-height:38vh;display:grid;place-items:center;overflow:hidden;background:#E9EFF3;touch-action:pan-y}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain}
.nocopy img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.lb-stage .nav{position:absolute;top:50%;transform:translateY(-50%);color:var(--ink);background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:50%;width:2.8rem;height:2.8rem;display:grid;place-items:center}
.lb-stage .prev{left:.5rem}.lb-stage .next{right:.5rem}
.lb-prog{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(29,42,53,.75);color:#fff;border-radius:10px;padding:.3rem .8rem;font-size:.85rem}
.lb-info{background:var(--surface);border-top:1px solid var(--line);padding:.9rem 1rem calc(1rem + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
.lb-acts{display:flex;gap:.45rem;flex-wrap:wrap;margin:.6rem 0}
.like.on{background:var(--like-soft);border-color:#F2B9C6;color:var(--like)}
.like.on .ic{fill:currentColor}
.mschip{display:inline-flex;align-items:center;gap:.3rem;background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:.2rem .65rem;font-size:.85rem;font-weight:600}
.cmt{padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.cmt small{color:var(--sub)}
.cmt .del{color:var(--sub);font-size:.78rem;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(6.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:99;font-size:.9rem;box-shadow:var(--shadow);max-width:90vw;text-align:center}

.center{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.login{max-width:420px;text-align:center;padding:2rem 1.5rem}
.login .logo{width:4.4rem;height:4.4rem;margin:0 auto .6rem;border-radius:22px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.login h1{margin:.2rem 0 .6rem;font-size:1.5rem}
.login h2{margin:.2rem 0 .6rem}
.spin{width:2.4rem;height:2.4rem;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.tile img,.album .cv img{transition:none}}


.bav{display:inline-flex;flex:none;border-radius:50%;overflow:hidden;align-items:flex-end;justify-content:center}
.bav img,.bav svg{width:100%;height:100%;object-fit:cover;display:block}
header.top{gap:.65rem}
.bcard{display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:1rem}
.bcard .grow{flex:1;min-width:0}.bcard b{font-size:1.15rem;display:block}.bcard .full{font-weight:400;color:var(--sub);font-size:.9rem;margin-left:.45rem}
.bcard small{display:block;color:var(--sub);font-size:.85rem;margin-top:.1rem}.bcard small.nx{display:flex;gap:.3rem;align-items:center;color:var(--accent)}
.av-prev{display:flex;justify-content:center;margin:.6rem 0}#avPrev{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}.seg label{cursor:pointer}.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{display:inline-block;padding:.5rem .95rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:.9rem}
.seg input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tour{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.tour .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;max-width:460px;width:100%;margin:0 auto}
.tour .big-ic{width:128px;height:128px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:1.6rem;overflow:hidden}
.tour .big-ic .bav{width:128px!important;height:128px!important}
.tour h2{font-size:1.5rem;margin:0 0 .6rem}.tour p{color:var(--sub);line-height:1.75;margin:0}
.tour .foot{padding:1rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));display:flex;gap:.6rem;align-items:center;justify-content:space-between;max-width:460px;width:100%;margin:0 auto}
.tour .skip{color:var(--sub);min-width:4rem;text-align:left;padding:.5rem 0}
.tour .dots{display:flex;gap:.4rem}.tour .dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.tour .dots i.on{background:var(--accent);width:20px}

.tile{background-size:cover;background-position:center}
.tile.up img{opacity:.85}
.tile .upbar{position:absolute;left:6px;right:6px;bottom:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);overflow:hidden}
.tile .upbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.album .cv{position:relative;aspect-ratio:4/3}
.album .cv::before{content:"";position:absolute;inset:-12px;background:var(--ph,none) center/cover;filter:blur(14px);opacity:.9}
.album .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.album .cv.por img{object-fit:contain}
.album .cv>.ic{position:relative}
.lb-stage::before{content:"";position:absolute;inset:-20px;background:var(--ph,none) center/cover;filter:blur(24px);opacity:.55}
.lb-stage img,.lb-stage video{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.uppill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(29,42,53,.14);border-radius:999px;padding:.5rem .6rem .5rem .9rem;font-weight:600;font-size:.9rem;max-width:92vw;white-space:nowrap}
.uppill small{color:var(--sub);font-weight:400;font-size:.78rem}
.uppill .ic{color:var(--danger)}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0}

/* 平板與電腦：版面跟著視窗變寬 */
@media (min-width:700px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px}
  .albums{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
}
@media (min-width:960px){
  body{padding-left:92px}
  nav.bottom{top:0;bottom:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:.5rem;padding:calc(1rem + env(safe-area-inset-top)) .3rem 1rem;border-top:0;border-right:1px solid var(--line)}
  nav.bottom button{width:100%;padding:.6rem .2rem;font-size:.78rem}
  nav.bottom button.on::before{top:20%;bottom:20%;left:-.3rem;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  nav.bottom .fab{order:-1;margin:0 auto .8rem;width:3.2rem;height:3.2rem}
  header.top{padding-inline:max(1.5rem, calc((100% - 1240px) / 2 + 1.5rem))}
  main{max-width:1240px;padding:1.5rem 1.5rem 3rem}
  main.narrow{max-width:780px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
  .tile{border-radius:8px}
  .albums{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .bcard{max-width:640px}
  .uppill{bottom:1.5rem;left:calc(50% + 46px)}
  .toast{bottom:1.5rem;left:calc(50% + 46px)}
  .lb{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
  .lb-top{grid-column:1 / -1}
  .lb-stage{min-height:0}
  .lb-info{max-height:none;border-top:0;border-left:1px solid var(--line);padding:1.2rem 1.3rem}
  .lb-stage .prev{left:1rem}.lb-stage .next{right:1rem}
}
@media (min-width:1500px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}

.tl-tools{display:flex;justify-content:flex-end;margin:.2rem 0 -.4rem}
.tile.selm .ck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(29,42,53,.25);display:grid;place-items:center;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tile.selm.on .ck{background:var(--accent);border-color:#fff}
.tile.selm.on img{transform:scale(.88);border-radius:6px}
.tile.selm img{transition:transform .15s}

/* ---------- 照片處理（壓縮＋自動去除 GPS 等 EXIF 隱私資訊） ---------- */
async function exifDate(file) {

        return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
      }

      o += 2 + len;
    }

// 部分 Android（OPPO/realme 等）和 iPhone 的照片是 HEIC，瀏覽器讀不了 → 先轉成 JPEG
const isHeic = f => /heic|heif/i.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || '');
let heicLib = null;
async function heicToJpeg(file) {
  if (!heicLib) heicLib = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'; sc.onload = () => res(window.heic2any); sc.onerror = () => { heicLib = null; rej(new Error('load')); }; document.head.appendChild(sc); });

  const b = Array.isArray(out) ? out[0] : out;
  return new File([b], (file.name || 'photo').replace(/\.(heic|heif)$/i, '') + '.jpg', { type: 'image/jpeg', lastModified: file.lastModified });
}
async function loadImg(file) {

  try { return await tryDecode(await heicToJpeg(file)); } catch {}

}
// 極小的預覽圖（約 1KB），存在資料裡，打開 App 就能先顯示模糊版

  const s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);

// 從影片抓一張有畫面的縮圖（避開全黑的開頭；部分 Android 要先播一下才解得出畫面）
async function grabFrame(src) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
  const wait = (ev, ms) => new Promise((ok, no) => {

    v.addEventListener(ev, () => { clearTimeout(t); ok(); }, { once: true });
    v.addEventListener('error', () => { clearTimeout(t); no(new Error('decode')); }, { once: true });
  });

    await wait('loadeddata', 20000);
    if (!v.videoWidth) { await v.play().catch(() => {}); await sleep(400); v.pause(); }

    c.width = Math.round(w * s); c.height = Math.round(h * s); const g = c.getContext('2d', { willReadFrequently: true });

  const thumb = await resize(img, w, h, 360, .75), disp = await resize(img, w, h, 1600, .85), full = await resize(img, w, h, 6000, .92), ph = tinyPh(img, w, h);

/* =====================================================================
   ② 資料後端：Google Apps Script ＋ 你的 Google 雲端硬碟（零費用）
   ===================================================================== */
const TOKEN_KEY = 'albumIdToken', SESSION_KEY = 'albumSession';
const jwtPayload = t => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return {}; } };
const jwtExp = t => (jwtPayload(t).exp || 0) * 1000;
async function waitGIS() {
  for (let i = 0; i < 150 && !window.google?.accounts?.id; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.google?.accounts?.id) throw new Error('Google 登入元件載入失敗，請檢查網路後重新整理');
}
function b64ToBlob(b64, type = '') { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); }
const toB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
const mkErr = code => { const e = new Error(code); e.code = code; return e; };

function makeGAS(url, clientId) {
  let token = LS.get(TOKEN_KEY, ''), session = LS.get(SESSION_KEY, ''), waiters = [];
  const setSession = v => { session = v || ''; LS.set(SESSION_KEY, session); };
  const sessEmail = () => { try { return JSON.parse(atob(session.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).e || ''; } catch { return ''; } };
  const cache = new Map(), inflight = new Map(), pending = new Map();
  let timer = null;

    if (valid()) return token;

    const t = await new Promise(res => { waiters.push(res); try { google.accounts.id.prompt(); } catch {} setTimeout(() => res(null), 12000); });
    if (!t) { setTimeout(() => { if (!$('#gbtn')) renderLogin('登入已過期，請再按一次登入'); }, 0); throw mkErr('TOKEN_EXPIRED'); }

    catch { throw mkErr('NETWORK'); }

  function flush() {
    timer = null;

      const list = groups[which];
      const per = which === 'disp' ? 4 : 12;   // 分小批同時送，第一批更快出現
      for (let i = 0; i < list.length; i += per) {
        const part = list.slice(i, i + per);
        call('media', { ids: part.map(([k]) => k.split('|')[1].split('@')[0]), which }).then(res => {
          for (const [k, e] of part) {
            const b = res[k.split('|')[1].split('@')[0]];

    if (inflight.has(k)) return inflight.get(k);

    demo: false,
    init(cb) {
      if (session) cb(true);   // 有保持登入的憑證：不用等 Google 登入元件，直接進相簿
      waitGIS().then(() => {

          client_id: clientId, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true,
          callback: r => { gotToken(r.credential); if (!S.me) cb(true); },

        catch (e) { if (e.code !== 'NETWORK') throw e; await new Promise(r => setTimeout(r, 2000)); await call('uploadChunk', { uploadId, start: s, b64 }); }
        onProg?.(Math.min(1, (s + CH) / full.size));
      }
      const rec = await call('uploadFinish', { uploadId });
      seed(rec.id, 'thumb', parts.thumb); if (parts.disp) seed(rec.id, 'disp', parts.disp);
      return { ...rec };
    },
    getMediaURL(p, which, onProg) { if (p._url) return Promise.resolve(p._url[which] || p._url.disp || p._url.thumb); return which === 'full' ? original(p, onProg) : media(p, which); },
    updatePhoto(p, patch) { return call('updatePhoto', { id: p.id, patch }); },
    async setThumb(p, blob, ph) { const r = await call('setThumb', { id: p.id, b64: await toB64(blob), ph }); seed(p.id, 'thumb', blob, r.tv); return r; },
    fixVideoThumbs() { return call('fixVideoThumbs'); },
    bulkState(ids, state) { return call('bulkState', { ids, state }); },
    toggleLike(p, email, on) { return call('like', { id: p.id, on }); },
    listComments(p) { return call('comments', { id: p.id }); },
    addComment(p, c) { return call('addComment', { id: p.id, text: c.text }); },
    deleteComment(p, c) { return call('delComment', { cid: c.id }); },
    deleteForever(p) { return call('deleteForever', { id: p.id }); },
    log(e) { return call('log', { text: e.text }).catch(() => {}); },
    listActivity() { return call('activity'); },
  };
}

async function boot() {

  const ua = navigator.userAgent;
  if (/ Line\//i.test(ua) && !location.search.includes('openExternalBrowser')) {
    location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash); return;
  }
  if (API_URL && /FBAN|FBAV|Instagram|MicroMessenger| Line\//i.test(ua)) return renderInApp();
  S.be = API_URL ? makeGAS(API_URL, GOOGLE_CLIENT_ID) : makeDemo();
  S.be.init(signed => signed ? loadAll() : renderLogin());
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function loadAll(keepView) {
  if (!keepView) app.innerHTML = '<div class="center"><div class="spin"></div></div>';
  try {
    const d = await S.be.bootstrap();
    S.me = d.me; S.cfg = d.cfg || {}; S.albums = d.albums || []; S.photos = d.photos || []; S.members = d.members || [];
    const key = 'lastSeen:' + S.me.email;
    if (!keepView) { S.prevSeen = LS.get(key, Date.now() - 3 * 864e5); LS.set(key, Date.now()); }
    if (S.albumId && !albumById(S.albumId)) S.albumId = null;
    render();
    if (!openDeepLink() && !keepView) maybeOnboard();
    autoFixVideoThumbs();
  } catch (e) {
    console.error(e);
    S.me = null;
    if (e.code === 'NOT_INVITED') return renderNotInvited(e.email);
    if (/TOKEN|NO_TOKEN/.test(e.code || '')) return renderLogin('請重新登入');
    if (e.code === 'NOT_SETUP') e.message = '後端還沒執行 setup，請參考設定教學第二步';
    app.innerHTML = `<div class="center"><div class="card login"><div class="logo">${ic('alert', 36)}</div><h2>讀取資料失敗</h2><p class="hint">${esc(e.code || e.message)}</p><div class="row" style="justify-content:center"><button class="btn" data-act="reload">重新整理</button><button class="btn ghost" data-act="signOut">登出</button></div></div></div>`;
  }
}

  if (ph) openLB(a + '/' + pid, 'all'); else toast('找不到這張照片，或你沒有查看的權限');
  return true;

const navBtn = (t, i, l) => `<button class="${S.tab === t ? 'on' : ''}" data-act="tab" data-tab="${t}">${ic(i, 24)}<span>${l}</span></button>`;

const normalPhotos = () => S.photos.filter(p => p.state === 'normal').sort((a, b) => b.takenAt - a.takenAt);
const visiblePhotos = () => normalPhotos().filter(p => !S.albumId || p.albumId === S.albumId);

  if (S.sel) {
    const k = p.albumId + '/' + p.id, can = canDel(p), on = S.sel.has(k);
    return `<button class="tile selm${on ? ' on' : ''}${can ? '' : ' no'}" data-act="selToggle" data-key="${k}" aria-pressed="${on}" aria-label="${can ? '選取這張' : '不能刪除這張'}"${ph}>

// 幾個月前的今天
function memories() {
  const now = new Date(), day = now.getDate(), out = [];
  normalPhotos().forEach(p => {
    const t = new Date(p.takenAt), diff = (now.getFullYear() - t.getFullYear()) * 12 + now.getMonth() - t.getMonth();
    if (diff >= 1 && t.getDate() === day) out.push({ p, diff });
  });
  return out.sort((a, b) => a.diff - b.diff).slice(0, 12);
}
function viewTimeline() {

  if (!ps.length) return bc + head + `<div class="empty">${ic('image', 44)}<p>這裡還沒有照片</p>${uploadableAlbums().length ? '<p class="hint">按下方的加號，上傳第一張吧。</p>' : ''}</div>`;
  const newCount = ps.filter(p => p.createdAt > S.prevSeen && p.uploader !== S.me.email).length;

  if (mem.length) html += `<section class="mem"><h2>${ic('clockBack', 19)}回憶</h2><div class="strip">${mem.map(({ p, diff }) => tile(p, 'memories', `<span class="lab">${diff} 個月前</span>`)).join('')}</div></section>`;

function ageHead(ts) {
  if (!S.cfg.birthday) return '';
  const b = new Date(S.cfg.birthday + 'T00:00:00'), d = new Date(ts);
  if (d < b) return '出生前';
  let m = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth(); if (d.getDate() < b.getDate()) m--;
  if (m < 1) return '新生兒';
  const y = Math.floor(m / 12), mm = m % 12;
  return y ? `${y} 歲${mm ? mm + ' 個月' : ''}` : `${m} 個月`;
}

const babyMonths = (ts = Date.now(), bday = S.cfg.birthday) => {

  let m = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth(); if (d.getDate() < b.getDate()) m--;

};
const stageOf = m => m < 0 ? 1 : m < 3 ? 0 : m < 12 ? 1 : m < 36 ? 2 : m < 72 ? 3 : 4;

/* 背景上傳：選完就關掉視窗，照片先用手機裡壓好的小圖顯示，原檔在背景慢慢傳 */
const UQ = { items: [], running: 0, total: 0, done: 0, ok: 0, okBy: {}, failed: [] };
function doUpload(btn) {
  const files = [...$('#upFiles').files]; if (!files.length) return toast('請先選擇檔案');
  const albumId = $('#upAlbum').value, caption = $('#upCap').value.trim(), milestone = readMs();
  files.forEach(f => UQ.items.push({ f, albumId, caption, milestone }));
  UQ.total += files.length;

  S.tab = 'timeline'; S.albumId = null; render(); scrollTo(0, 0);

}
function pumpUpload() { while (UQ.running < 2 && UQ.items.length) runUpload(UQ.items.shift()); drawUpPill(); }
const softRender = () => { if (['timeline', 'albums', 'milestones'].includes(S.tab) && !S.adminView) render(); };
async function runUpload(job) {
  UQ.running++; drawUpPill();
  let local = null;
  try {
    const f = job.f;
    if (S.photos.some(p => p.albumId === job.albumId && p.srcName === f.name && p.srcSize === f.size && p.state !== 'trash')) { UQ.skip = (UQ.skip || 0) + 1; return; }
    const item = await prepareFile(f);
    const meta = { kind: item.kind, takenAt: item.takenAt, createdAt: Date.now(), uploader: S.me.email, caption: job.caption, milestone: job.milestone, w: item.w, h: item.h, srcName: f.name, srcSize: f.size, ph: item.ph || '' };
    if (item.duration) meta.duration = item.duration;
    if (item.kind === 'video' && !item.noFrame) meta.thumbOk = true;
    const _url = {}; item.parts.forEach(([k, b]) => { if (k !== 'full') _url[k] = URL.createObjectURL(b); });
    local = { id: 'up' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), albumId: job.albumId, ...meta, state: 'normal', likes: [], commentCount: 0, _local: true, _url, _prog: 0 };
    S.photos.push(local); softRender();
    const rec = await S.be.upload(job.albumId, item, meta, x => { local._prog = x; updUpTile(local); drawUpPill(); });
    const i = S.photos.indexOf(local); if (i >= 0) S.photos[i] = rec; else S.photos.push(rec);
    setTimeout(() => Object.values(_url).forEach(u => URL.revokeObjectURL(u)), 60000);
    UQ.ok++; UQ.okBy[job.albumId] = (UQ.okBy[job.albumId] || 0) + 1;
    softRender();
  } catch (e) {
    console.error(e);
    if (local) { S.photos = S.photos.filter(p => p !== local); softRender(); }
    job.err = e.code === 'NO_UPLOAD' ? '沒有上傳權限' : (e.message || e.code || '未知錯誤');
    UQ.failed.push(job);
  } finally {
    UQ.running--; UQ.done++;
    if (!UQ.running && !UQ.items.length) finishUploads();
    pumpUpload();
  }
}
function finishUploads() {
  Object.entries(UQ.okBy).forEach(([aid, n]) => logAct(`上傳了 ${n} 個檔案到「${albumById(aid)?.name || ''}」`));
  const msg = `上傳完成 ${UQ.ok} 個` + (UQ.skip ? `，略過重複 ${UQ.skip} 個` : '') + (UQ.failed.length ? `，${UQ.failed.length} 個失敗` : '');
  toast(msg, 3500);

}
function updUpTile(p) {
  const bar = document.querySelector(`.tile[data-key="${p.albumId}/${p.id}"] .upbar i`);

}
function drawUpPill() {
  let el = $('#upPill');

  keepAwake(!!busy);
  if (!busy && !UQ.failed.length) { el?.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'upPill'; el.className = 'uppill'; document.body.appendChild(el); }
  if (busy) {

    el.innerHTML = `<span class="spin sm"></span><span>上傳中 ${Math.min(UQ.done + 1, UQ.total)}/${UQ.total}${cur.length ? ` · ${Math.round(pr * 100)}%` : ''}</span><small>螢幕會保持亮著，請先不要關掉 App</small>`;
    el.removeAttribute('data-act');
  } else {
    el.innerHTML = `${ic('alert', 18)}<span>${UQ.failed.length} 個上傳失敗</span><button class="btn sm" data-act="upRetry">重試</button><button class="ibtn" data-act="upDismiss" aria-label="關閉">${ic('close', 18)}</button>`;
  }
}

// 上傳期間讓螢幕保持亮著（手機自動關螢幕會讓上傳中斷）
let wakeLock = null, wlPending = false;
async function keepAwake(on) {

    if (on && !wakeLock && !wlPending && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wlPending = true;
      try { wakeLock = await navigator.wakeLock.request('screen'); } finally { wlPending = false; }
      if (!(UQ.running || UQ.items.length)) { const w = wakeLock; wakeLock = null; await w.release(); return; }
      wakeLock.addEventListener('release', () => { wakeLock = null; });

  } catch { wakeLock = null; }
}

// 每張照片算一個 12×12 的小色塊指紋；重新上傳、轉檔過的同一張照片指紋幾乎一樣，連拍的不同張則差很多

async function dhashOf(p) {

async function findDups() {

  const ps = S.photos.filter(p => !p._local && (p.state === 'normal' || p.state === 'hidden'));

  prog();

  await Promise.all([1, 2, 3, 4, 5, 6].map(worker));

  const parent = ps.map((_, i) => i), find = i => parent[i] === i ? i : (parent[i] = find(parent[i])), join = (a, b) => { parent[find(a)] = find(b); };

    const a = ps[i], b = ps[j];

    const same = a.srcName && a.srcName === b.srcName && a.srcSize && a.srcSize === b.srcSize;

  drawDups(fail.size);
}

    <label class="f">對方的 Gmail（Google 帳號）</label><input id="mEmail" type="email" value="${esc(m.email)}" ${email ? 'disabled' : ''} placeholder="example@gmail.com">
    <label class="f">稱呼</label><input id="mName" value="${esc(m.name || '')}" placeholder="例如：阿嬤、台中奶奶">
    <label class="f">關係</label><select id="mRel"><option value="">—</option>${RELATIONS.map(r => `<option ${r === m.relation ? 'selected' : ''}>${r}</option>`).join('')}</select>
    <label class="f">權限</label><select id="mRole">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${m.role === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
    <p class="hint" id="mRoleHint">${ROLES[m.role].can}</p>
    <label class="chk"><input type="checkbox" id="mDl" ${m.canDownload ? 'checked' : ''}> 允許下載照片</label>
    <div class="row" style="margin-top:1rem"><button class="btn" data-act="saveMember" data-email="${esc(email || '')}">${email ? '儲存' : '加入並產生邀請訊息'}</button><button class="btn ghost" data-act="closeModal">取消</button><span class="sp"></span>
    ${email ? `<button class="btn danger sm" data-act="removeMember" data-email="${esc(email)}">移除</button>` : ''}</div>
    ${email ? '<p class="hint">移除後，對方立刻看不到任何照片。</p>' : ''}`);
}
function inviteText(m) {
  const url = location.origin + location.pathname + '?openExternalBrowser=1';
  return `${m.name || ''}您好！我們建立了${babyName()}的家庭相簿。\n\n1. 打開這個網址：\n${url}\n（如果在 LINE 裡打不開，請按右上角選單，選「用瀏覽器開啟」）\n\n2. 按「用 Google 帳號登入」，選擇：\n${m.email}\n\n3. 登入後可以「加入主畫面」，以後點圖示就能看${babyName()}的照片了。`;
}
function showInvite(m) {
  const t = inviteText(m);
  openModal(`<h2>邀請訊息</h2><p class="hint">已把 ${esc(m.name || m.email)} 加入。把下面的訊息傳給對方：</p>
    <textarea readonly style="min-height:12rem">${esc(t)}</textarea>
    <div class="row" style="margin-top:.7rem"><button class="btn" data-act="copy" data-text="${esc(t)}">複製</button>
    <a class="btn line" href="https://line.me/R/msg/text/?${encodeURIComponent(t)}" target="_blank" rel="noopener">用 LINE 傳送</a>
    <button class="btn ghost" data-act="closeModal">完成</button></div>`);
}
async function showLog() {
  const box = $('#logBox'); if (!box) return;
  try {
    const xs = await S.be.listActivity();
    box.innerHTML = xs.length ? xs.map(x => `<div class="log"><small>${fmtTime(x.at)}</small><b>${esc(x.actorName)}</b> ${esc(x.text)}</div>`).join('') : '<div class="hint">還沒有紀錄</div>';
  } catch { box.innerHTML = '<div class="hint">讀取失敗</div>'; }
}

/* ---------- 事件 ---------- */
const keyP = k => { const [a, p] = k.split('/'); return findPhoto(a, p); };
const ACT = {
  reload: () => location.reload(),
  refresh: () => loadAll(true).then(() => toast('已更新')),
  signOut: async () => { await S.be.signOut(); if (!S.be.demo) location.reload(); },
  copy: async el => { try { await navigator.clipboard.writeText(el.dataset.text); toast('已複製'); } catch { toast('請長按文字手動複製'); } },
  tab: el => { if (S.sel) { S.sel = null; $('#selBar')?.remove(); } S.tab = el.dataset.tab; S.adminView = null; if (S.tab !== 'timeline') S.albumId = null; render(); scrollTo(0, 0); },
  openAlbum: el => { S.albumId = el.dataset.id; S.tab = 'timeline'; render(); scrollTo(0, 0); },
  clearAlbum: () => { S.albumId = null; render(); },
  feed: () => openFeed(),
  upload: () => openUpload(),
  doUpload: el => doUpload(el),
  upInfo: () => toast('這張還在上傳，完成後就能打開'),
  upRetry: () => { const f = UQ.failed; UQ.failed = []; UQ.items.push(...f); UQ.total = f.length; UQ.done = 0; pumpUpload(); },
  upDismiss: () => { UQ.failed = []; UQ.total = 0; drawUpPill(); },
  closeModal: () => closeModal(),
  open: el => { closeModal(); openLB(el.dataset.key, el.dataset.list); },
  selStart: () => selStart(),
  selCancel: () => selEnd(),
  selToggle: el => { const k = el.dataset.key, p = keyP(k); if (!p || !canDel(p)) return toast(isAdmin() ? '這張不能選' : '只能刪除自己上傳的照片');
    S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k); const on = S.sel.has(k); el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); el.querySelector('.ck').innerHTML = on ? ic('check', 16) : ''; drawSelBar(); },
  selMonth: el => { const k = Number(el.dataset.k); visiblePhotos().filter(p => { const d = new Date(p.takenAt); return d.getFullYear() * 100 + d.getMonth() === k && canDel(p); })
    .forEach(p => S.sel.add(p.albumId + '/' + p.id)); render(); drawSelBar(); },
  selDo: async el => { const st = el.dataset.s, keys = [...S.sel]; if (!keys.length) return;
    if (st === 'trash' && !confirm(`把 ${keys.length} 張移到回收桶？（30 天內可還原）`)) return;
    el.disabled = true; try { const n = await bulkApply(keys, st); toast(st === 'trash' ? `已把 ${n} 張移到回收桶` : `已隱藏 ${n} 張`); selEnd(); } catch (e) { el.disabled = false; toast('失敗：' + (e.code || '')); } },
  dupToggle: el => { const k = el.dataset.key; S.dupSel.has(k) ? S.dupSel.delete(k) : S.dupSel.add(k);
    const g = S.dups.find(g => g.some(p => p.albumId + '/' + p.id === k)); if (g && g.every(p => S.dupSel.has(p.albumId + '/' + p.id))) toast('這組全部都勾了，整組都會被刪除'); drawDups(); },
  dupDelete: async el => { const keys = [...S.dupSel]; if (!keys.length || !confirm(`把 ${keys.length} 張重複照片移到回收桶？（30 天內可還原）`)) return;
    el.disabled = true; try { const n = await bulkApply(keys, 'trash'); toast(`已把 ${n} 張重複照片移到回收桶`); findDups(); } catch (e) { el.disabled = false; toast('失敗：' + (e.code || '')); } },
  lbClose: () => closeLB(),
  lbGo: el => lbGo(+el.dataset.d),
  download: () => downloadCur(),
  shareOpen: () => openShare(),
  shareFile: () => shareFile(),
  shareNative: async () => { const p = curP(); try { await navigator.share({ title: shareText(p), text: shareText(p), url: shareLink(p) }); closeModal(); } catch (e) { if (e.name !== 'AbortError') toast('分享失敗'); } },
  like: async () => { const p = curP(), on = !(p.likes || []).includes(S.me.email);
    try { await S.be.toggleLike(p, S.me.email, on); p.likes = on ? [...(p.likes || []), S.me.email] : p.likes.filter(e => e !== S.me.email); const sp = findPhoto(p.albumId, p.id); if (sp && sp !== p) sp.likes = p.likes; drawLB(); } catch { toast('失敗了，再試一次'); } },
  addCmt: async () => { const t = $('#cmtIn').value.trim(); if (!t) return; const p = curP();
    try { await S.be.addComment(p, { author: S.me.email, name: S.me.name || '', text: t, at: Date.now() }); p.commentCount = (p.commentCount || 0) + 1; $('#cmtIn').value = ''; loadComments(p); } catch { toast('留言失敗'); } },
  delCmt: async el => { const p = curP(), c = S.lb.comments.find(x => x.id === el.dataset.id); if (!c || !confirm('刪除這則留言？')) return;
    try { await S.be.deleteComment(p, c); loadComments(p); } catch { toast('刪除失敗'); } },
  editPhoto: () => openEditPhoto(),
  saveEditPhoto: async () => { const p = curP(), patch = { caption: $('#epCap').value.trim(), milestone: readMs() };
    try { await S.be.updatePhoto(p, patch); Object.assign(p, patch); closeModal(); drawLB(); toast('已儲存'); } catch { toast('儲存失敗'); } },
  setCover: async () => { const p = curP(); try { await S.be.saveAlbum({ id: p.albumId, coverId: p.id }); albumById(p.albumId).coverId = p.id; toast('已設為相簿封面'); } catch { toast('失敗'); } },
  toggleHide: async () => { const p = curP(), hide = p.state !== 'hidden';
    try { await setState(p, hide ? 'hidden' : 'normal', hide ? '把 1 張照片設為隱藏' : '取消隱藏 1 張照片'); if (S.lb.listName === 'timeline' || S.lb.listName === 'milestones' || S.lb.listName === 'hidden' || S.lb.listName === 'all') { S.lb.list.splice(S.lb.i, 1); if (S.lb.i >= S.lb.list.length) S.lb.i--; } S.lb.list.length ? drawLB() : closeLB(); } catch { toast('失敗'); } },
  trash: async () => { if (!confirm(isAdmin() ? '移到回收桶？（30 天內可還原）' : '刪除這個檔案？（爸媽可以在 30 天內幫你還原）')) return; const p = curP();
    try { await setState(p, 'trash', `把 1 個檔案移到回收桶（${albumById(p.albumId)?.name}）`); S.lb.list.splice(S.lb.i, 1); if (S.lb.i >= S.lb.list.length) S.lb.i--; S.lb.list.length ? drawLB() : closeLB(); } catch { toast('刪除失敗'); } },
  restore: async el => { const p = keyP(el.dataset.key); try { await setState(p, 'normal', '還原了 1 個檔案'); render(); } catch { toast('失敗'); } },
  purge: async el => { const p = keyP(el.dataset.key); if (!confirm('永久刪除後無法復原，確定嗎？')) return;
    try { await S.be.deleteForever(p); S.photos = S.photos.filter(x => x !== p); logAct('永久刪除了 1 個檔案'); render(); } catch { toast('刪除失敗'); } },
  adminView: el => { S.adminView = el.dataset.v || null; render(); scrollTo(0, 0); if (S.adminView === 'log') showLog(); if (S.adminView === 'dups') findDups(); },
  babyEdit: () => openBabyEdit(false),
  babyCancel: () => { closeModal(); const f = S._after; S._after = null; f && f(); },
  saveBaby: async el => {
    const name = $('#bName').value.trim(); if (!name) return toast('請輸入暱稱');
    const mode = document.querySelector('input[name=avm]:checked').value;
    if (mode === 'photo' && !avTmp) return toast('請選一張頭像照片');
    const c = { babyName: name, fullName: $('#bFull').value.trim(), birthday: $('#bBirth').value, gender: document.querySelector('input[name=bg]:checked').value,
      avatarMode: mode, avatar: mode === 'photo' ? avTmp : (S.cfg.avatar || ''), setupDone: true };
    try { await S.be.setConfig(c); Object.assign(S.cfg, c); logAct('更新了寶寶資料'); closeModal(); const f = S._after; S._after = null; render(); toast('已儲存'); f && f(); }
    catch (e) { toast('儲存失敗：' + (e.code || '')); } },
  tourNext: () => startTour(S.tour.i + 1),
  tourEnd: () => endTour(),
  replayTour: () => startTour(0),
  tourAlbum: () => { endTour(); S.tab = 'albums'; render(); openEditAlbum(); },
  tourInvite: () => { endTour(); S.tab = 'me'; S.adminView = null; render(); ACT.editMember({ dataset: {} }); },
  editAlbum: el => openEditAlbum(el.dataset.id),
  saveAlbum: async el => {
    const name = $('#alName').value.trim(); if (!name) return toast('請輸入相簿名稱');
    const a = { name, visibility: document.querySelector('input[name=alVis]:checked').value, allowed: [...document.querySelectorAll('.alAllow:checked')].map(x => x.value), allowUpload: $('#alUp').checked };
    if (el.dataset.id) a.id = el.dataset.id; else a.createdAt = Date.now();
    try { const id = await S.be.saveAlbum(a); const ex = albumById(id); ex ? Object.assign(ex, a) : S.albums.push({ ...a, id }); logAct(`${el.dataset.id ? '修改' : '建立'}了相簿「${name}」（${VIS[a.visibility].label}${a.allowed.length ? ` + ${a.allowed.map(memberName).join('、')}` : ''}）`); closeModal(); render(); toast('已儲存'); }
    catch (e) { toast('儲存失敗：' + (e.code || '')); } },
  delAlbum: async el => { const a = albumById(el.dataset.id); if (!confirm(`刪除相簿「${a.name}」？`)) return;
    try { await S.be.deleteAlbum(a.id); S.albums = S.albums.filter(x => x !== a); logAct(`刪除了相簿「${a.name}」`); closeModal(); render(); } catch { toast('刪除失敗'); } },
  editMember: el => openEditMember(el.dataset.email),
  saveMember: async el => {
    const isNew = !el.dataset.email, email = (isNew ? $('#mEmail').value : el.dataset.email).trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('請輸入正確的 Email');
    if (isNew && S.members.some(m => m.email === email)) return toast('這個 Email 已經在名單裡');
    const m = { email, name: $('#mName').value.trim() || $('#mRel').value || email.split('@')[0], relation: $('#mRel').value, role: $('#mRole').value, canDownload: $('#mDl').checked };
    if (isNew) m.addedAt = Date.now();
    try { await S.be.saveMember(m); const ex = S.members.find(x => x.email === email); ex ? Object.assign(ex, m) : S.members.push(m);
      logAct(`${isNew ? '把' : '修改'}「${m.name}」${isNew ? '加入相簿' : '的權限'}（${ROLES[m.role].short}${m.canDownload ? '' : '、不可下載'}）`);
      render(); isNew ? showInvite(m) : (closeModal(), toast('已儲存')); }
    catch (e) { toast('儲存失敗：' + (e.code || '')); } },
  removeMember: async el => { const m = S.members.find(x => x.email === el.dataset.email); if (!confirm(`確定移除「${m.name}」？對方會立刻看不到所有照片。`)) return;
    try { await S.be.removeMember(m.email); S.members = S.members.filter(x => x !== m);
      for (const a of S.albums.filter(a => (a.allowed || []).includes(m.email))) { a.allowed = a.allowed.filter(e => e !== m.email); await S.be.saveAlbum({ id: a.id, allowed: a.allowed }).catch(() => {}); }
      logAct(`把「${m.name}」移出相簿`); closeModal(); render(); toast('已移除'); } catch { toast('移除失敗'); } },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'msSel') { $('#msCustom').style.display = el.value === '__c' ? '' : 'none'; return; }
  if (el.id === 'mRole') { $('#mRoleHint').textContent = ROLES[el.value].can; return; }
  if (el.dataset.change === 'presence') { const v = el.checked; S.be.setConfig({ showPresence: v }).then(() => { S.cfg.showPresence = v; toast('已儲存'); }).catch(() => { el.checked = !v; toast('儲存失敗'); }); return; }
  if (el.id === 'bBirth' || el.name === 'bg' || el.name === 'avm') { refreshAvPrev(); return; }
  if (el.id === 'avFile') { const f = el.files[0]; if (f) cropAvatar(f).then(u => { avTmp = u; refreshAvPrev(); }).catch(() => toast('這張圖片讀不了，換一張試試')); return; }
  if (el.dataset.change === 'bigText') { document.documentElement.classList.toggle('big', el.checked); LS.set('bigText', el.checked); return; }
  if (el.dataset.change === 'demoUser') { S.be.setUser(el.value); S.tab = 'timeline'; S.albumId = null; S.adminView = null; loadAll(true).then(() => toast(`現在以「${memberName(el.value)}」的身分預覽`)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cmtIn') ACT.addCmt();
  if (!S.lb) return;
  if (e.key === 'ArrowLeft') lbGo(-1); if (e.key === 'ArrowRight') lbGo(1); if (e.key === 'Escape' && !$('#modal')) closeLB();
});

boot();
</script>
</body>
</html>
